<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Glowing Geometric Aid Polygon -->
  <polygon points="256,64 432,160 432,352 256,448 80,352 80,160" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#glow)" opacity="0.4" />
  <polygon points="256,64 432,160 432,352 256,448 80,352 80,160" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Amanat 'A' Emblem -->
  <path d="M256 128 L360 360 L296 360 L272 304 L240 304 L216 360 L152 360 Z M256 220 L246 256 L266 256 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <path d="M256 128 L360 360 L296 360 L272 304 L240 304 L216 360 L152 360 Z M256 220 L246 256 L266 256 Z" fill="#ffffff" opacity="0.95" />

  <!-- Digital Verification Nodes -->
  <circle cx="256" cy="64" r="14" fill="#38bdf8" />
  <circle cx="432" cy="160" r="14" fill="#10b981" />
  <circle cx="432" cy="352" r="14" fill="#38bdf8" />
  <circle cx="256" cy="448" r="14" fill="#10b981" />
  <circle cx="80" cy="352" r="14" fill="#38bdf8" />
  <circle cx="80" cy="160" r="14" fill="#10b981" />
</svg>
